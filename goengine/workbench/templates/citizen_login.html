<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Third Eye</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/theme.css?v=2">
{% from "_partials.html" import mark, theme_init_script %}
{{ theme_init_script() }}
</head>
<body class="auth-page">
<a class="back-home" href="/">← Third Eye</a>
<div class="auth-card">
  <div class="auth-brand">{{ mark(30, 'citizenLoginMark') }} <span>Third Eye</span></div>
  <h1>Welcome back</h1>
  <p class="sub">Sign in to download Government Orders and manage your dashboard</p>
  <form method="post" action="/citizen/login">
    <input type="hidden" name="next" value="{{ next or '' }}">
    <div class="auth-field">
      <label for="email">Email address</label>
      <input id="email" type="email" name="email" required autofocus autocomplete="email">
    </div>
    <div class="auth-field" style="margin-bottom:0;">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" required autocomplete="current-password">
    </div>
    <button class="auth-submit" type="submit">Sign In</button>
  </form>
  {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
  <p class="auth-switch">New to Third Eye? <a href="/register{% if next %}?next={{ next }}{% endif %}">Register for free</a></p>
</div>
<script src="/static/theme.js?v=2" defer></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register — Third Eye</title>
<meta name="description" content="Register for free to download Government Orders, save searches, and access your citizen dashboard.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/theme.css?v=2">
{% from "_partials.html" import mark, theme_init_script %}
{{ theme_init_script() }}
</head>
<body class="auth-page">
<a class="back-home" href="/">← Third Eye</a>
<div class="auth-card auth-card-wide">
  <div class="auth-brand">{{ mark(30, 'registerMark') }} <span>Third Eye</span></div>
  <h1>Register for free</h1>
  <p class="sub">Download Government Orders, save searches, and track projects</p>
  <form method="post" action="/register">
    <input type="hidden" name="next" value="{{ next or '' }}">
    <div class="auth-field">
      <label for="full_name">Full name</label>
      <input id="full_name" type="text" name="full_name" required autofocus autocomplete="name">
    </div>
    <div class="auth-field">
      <label for="email">Email address</label>
      <input id="email" type="email" name="email" required autocomplete="email">
    </div>
    <div class="auth-field">
      <label for="mobile">Mobile number (optional)</label>
      <input id="mobile" type="tel" name="mobile" autocomplete="tel">
    </div>
    <div class="auth-field">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" required autocomplete="new-password" minlength="8">
    </div>
    <div class="auth-field" style="margin-bottom:0;">
      <label for="confirm_password">Confirm password</label>
      <input id="confirm_password" type="password" name="confirm_password" required autocomplete="new-password" minlength="8">
    </div>
    <label class="auth-field-check">
      <input type="checkbox" name="terms_accepted" value="1" required>
      <span>I agree to Third Eye's terms of use and understand this platform provides information sourced from official government records.</span>
    </label>
    <button class="auth-submit" type="submit">Register Now</button>
  </form>
  {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
  <p class="auth-switch">Already have an account? <a href="/citizen/login{% if next %}?next={{ next }}{% endif %}">Sign in</a></p>
</div>
<script src="/static/theme.js?v=2" defer></script>
</body>
</html>

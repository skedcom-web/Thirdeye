<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in &middot; Thirdeye</title>
<style>
  :root { --bg: #f6f7f9; --panel: #fff; --ink: #16191d; --muted: #666e7a; --line: #dfe3e8; --accent: #1d4ed8; --bad: #b91c1c; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 32px;
          width: 340px; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .4px; }
  input { width: 100%; border: 1px solid var(--line); border-radius: 4px; padding: 9px 10px; font: inherit; }
  button { width: 100%; margin-top: 20px; background: var(--accent); color: #fff; border: 0;
           border-radius: 4px; padding: 10px; font-size: 14px; cursor: pointer; }
  .error { background: #fee2e2; color: var(--bad); border-radius: 4px; padding: 8px 10px; font-size: 13px; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <h1>Thirdeye Operations Control Center</h1>
  <p class="sub">Sign in to continue.</p>
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next or '/' }}">
    <label for="username">Username</label>
    <input id="username" type="text" name="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" type="password" name="password" required>
    <button type="submit">Sign in</button>
  </form>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
</div>
</body>
</html>

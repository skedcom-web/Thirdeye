[project]
name = "thirdeye"
version = "0.3.0"
description = "Evidence-First Government Order Intelligence Engine (Phase 1 + 2 + 3)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "beautifulsoup4>=4.13",
    # Remote database (Turso/libSQL) -- goengine/db.py connects here in
    # production instead of a local SQLite file (see goengine/turso_db.py).
    # FastAPI Cloud reads dependencies from this file, not requirements.txt,
    # so this must stay in sync with it.
    "libsql-client>=0.3",
    # [standard] extra pulls in fastapi-cli, which is what actually provides
    # the `fastapi` command FastAPI Cloud's container invokes at startup --
    # plain fastapi alone leaves that command missing and the app never boots.
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "pypdf>=5.1",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24", "pdfplumber>=0.11"]
# Module 4 (OCR). Also requires the Tesseract binary itself -- see README.
ocr = ["pytesseract>=0.3.10", "pillow>=10.0"]
dev = ["pytest>=8.3"]

[project.scripts]
thirdeye = "goengine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["goengine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

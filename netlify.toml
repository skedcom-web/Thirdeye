[build]
  command = "pip install -r requirements.txt"
  publish = "goengine/workbench/static"

[build.environment]
  PYTHON_VERSION = "3.11"
  # Build-time only -- Netlify doesn't carry [build.environment] into the
  # deployed function's runtime env, so this does NOT make the app read
  # /tmp at request time. [functions.environment] below is what actually
  # takes effect when the function runs; config.py also falls back to
  # /tmp/thirdeye on its own if this is ever missing from either place.
  THIRDEYE_DATA_DIR = "/tmp/thirdeye"

[functions]
  directory = "netlify/functions"
  # Netlify's Python function bundler only picks up .py files by default --
  # the Jinja2 templates and static assets goengine/workbench/deps.py loads
  # at import time (TEMPLATES_DIR/STATIC_DIR) have to be listed explicitly
  # or every page render 500s with a TemplateNotFound error.
  included_files = ["goengine/workbench/templates/**", "goengine/workbench/static/**"]

[functions.environment]
  THIRDEYE_DATA_DIR = "/tmp/thirdeye"

[[redirects]]
  from = "/static/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app"
  status = 200

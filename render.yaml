services:
  - type: web
    name: thirdeye
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn goengine.workbench.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: THIRDEYE_ENV
        value: production
      - key: THIRDEYE_DATA_DIR
        value: /var/lib/thirdeye
      - key: PYTHON_VERSION
        value: 3.11.9
    disk:
      name: thirdeye-data
      mountPath: /var/lib/thirdeye
      sizeGB: 1
